version: '3.8'

# AI Software Factory - Application Stack
# This stack contains the backend, frontend, nginx, watchtower, and cockpit
# It connects to the shared ai-factory-shared network for infrastructure services

services:
  # AI Software Factory Backend
  backend:
    image: revanth2245/aisoftwarefactory-backend:staging
    container_name: ai-factory-backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://aifactory:Itslogical1.@postgres:5432/aifactory
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - backend_data:/app/data
    networks:
      - ai-factory-shared

  # AI Software Factory Frontend
  frontend:
    image: revanth2245/aisoftwarefactory-frontend:staging
    container_name: ai-factory-frontend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://ai-staging.thetalogics.com/api
    networks:
      - ai-factory-shared
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "80:80"
    networks:
      - ai-factory-shared
    depends_on:
      - frontend
      - backend

  # Watchtower - Auto-updates containers when new images are pushed
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - ai-factory-shared

  # Cockpit - System monitoring dashboard
  cockpit:
    image: cockpit/ws:latest
    container_name: cockpit
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "9090:9090"
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    networks:
      - ai-factory-shared

volumes:
  backend_data:

networks:
  ai-factory-shared:
    external: true
