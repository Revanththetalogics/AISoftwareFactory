services:
  backend:
    image: ${BACKEND_IMAGE:-revanth2245/aisoftwarefactory-backend:staging}
    container_name: ai-factory-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://aifactory:${POSTGRES_PASSWORD}@postgres:5432/aifactory
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-llama3.2}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ai-staging.thetalogics.com}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-ai-staging.thetalogics.com}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    volumes:
      - backend_data:/app/data
    networks:
      - ai-factory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; r = httpx.get('http://localhost:8000/api/v1/health/simple', timeout=5.0); sys.exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  frontend:
    image: ${FRONTEND_IMAGE:-revanth2245/aisoftwarefactory-frontend:staging}
    container_name: ai-factory-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_* vars are baked at build time — this is a local dev fallback only
      - NEXT_PUBLIC_API_URL=/api/v1
    networks:
      - ai-factory
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3000/',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  nginx:
    # Custom image: nginx:alpine + Next.js static assets baked in at build time.
    # /_next/static/ and /public/ are served directly from disk — no Node.js involvement.
    image: ${NGINX_IMAGE:-revanth2245/aisoftwarefactory-nginx:staging}
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ai-factory
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-factory
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aifactory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-factory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifactory"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ai-factory
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
  ollama_data:
  postgres_data:
  redis_data:

networks:
  ai-factory:
    driver: bridge