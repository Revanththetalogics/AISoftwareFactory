version: '3.8'

# AI Software Factory - Complete Single Stack
# All services in one Docker Compose file for easy deployment

services:
  # AI Software Factory Backend
  backend:
    image: revanth2245/aisoftwarefactory-backend:staging
    container_name: ai-factory-backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://aifactory:Itslogical1.@postgres:5432/aifactory
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - backend_data:/app/data
    networks:
      - ai-factory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # AI Software Factory Frontend
  frontend:
    image: revanth2245/aisoftwarefactory-frontend:staging
    container_name: ai-factory-frontend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://ai-staging.thetalogics.com/api
    networks:
      - ai-factory
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "80:80"
    networks:
      - ai-factory
    depends_on:
      - frontend
      - backend

  # Ollama AI Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-factory

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aifactory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-factory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifactory"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ai-factory
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Watchtower - Auto-updates containers when new images are pushed
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - ai-factory

volumes:
  backend_data:
  ollama_data:
  postgres_data:
  redis_data:

networks:
  ai-factory:
    driver: bridge
