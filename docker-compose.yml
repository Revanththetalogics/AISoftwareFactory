services:
  backend:
    image: ${BACKEND_IMAGE:-revanth2245/aisoftwarefactory-backend:staging}
    container_name: ai-factory-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://aifactory:${POSTGRES_PASSWORD}@postgres:5432/aifactory
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-llama3.2}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ai-staging.thetalogics.com}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-ai-staging.thetalogics.com}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    volumes:
      - backend_data:/app/data
    networks:
      - ai-factory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; r = httpx.get('http://localhost:8000/api/v1/health/simple', timeout=5.0); sys.exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  frontend:
    image: ${FRONTEND_IMAGE:-revanth2245/aisoftwarefactory-frontend:staging}
    container_name: ai-factory-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 🔥 FIX: use internal nginx routing
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - ai-factory
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # 🔥 FIX: absolute path (Portainer requirement)
      - /home/ubuntu/nginx.conf:/etc/nginx/conf.d/00-ai-factory.conf:ro
    networks:
      - ai-factory
    depends_on:
      - frontend
      - backend
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-factory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Pulls the 4 required LLM models into Ollama on first deploy.
  # Runs once and exits — restarts are skipped if models already exist.
  # Does NOT block other services — backend/frontend start independently.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    restart: "no"
    networks:
      - ai-factory
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
        echo '=== Pulling LLM models into Ollama ===' &&
        ollama pull llama3.2 &&
        ollama pull deepseek-coder-v2 &&
        ollama pull qwen2.5 &&
        ollama pull mixtral:8x7b &&
        echo '=== All models ready ==='
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aifactory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-factory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifactory"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ai-factory
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
  ollama_data:
  postgres_data:
  redis_data:

networks:
  ai-factory:
    driver: bridge