version: '3.8'

# Infrastructure Services Stack
# This stack provides shared infrastructure services for the AI Software Factory
# It creates a shared network that other stacks can connect to

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aifactory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-factory-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifactory"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ai-factory-shared
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Ollama AI Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-factory-shared
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  ai-factory-shared:
    external: true
