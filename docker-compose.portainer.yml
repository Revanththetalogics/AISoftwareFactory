# AI Software Factory - Portainer Enterprise Stack
# Optimized for your VPS: 12 vCores, 48GB RAM, 300GB Storage

services:
  # Portainer Agent for remote management
  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - portainer-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # AI Software Factory Backend - Optimized for 12 cores
  backend:
    image: revanth2245/aisoftwarefactory-backend:staging
    container_name: ai-factory-backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://aifactory:${POSTGRES_PASSWORD}@postgres:5432/aifactory
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - SECRET_KEY=${SECRET_KEY}
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      - CORS_ORIGINS=https://${DOMAIN}
      - ALLOWED_HOSTS=${DOMAIN}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    volumes:
      - backend_data:/app/data
      - ./logs/backend:/app/logs
    networks:
      - ai-factory-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '3.0'  # Utilize your 12 cores effectively
          memory: 8G   # Use portion of your 48GB RAM
        reservations:
          cpus: '1.0'
          memory: 4G

  # AI Software Factory Frontend
  frontend:
    image: revanth2245/aisoftwarefactory-frontend:staging
    container_name: ai-factory-frontend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
      - NEXT_PUBLIC_WS_URL=wss://${DOMAIN}/ws
    volumes:
      - frontend_cache:/app/.next/cache
    networks:
      - ai-factory-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Nginx Reverse Proxy - Simplified for Portainer compatibility
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_HOST=ai-staging.thetalogics.com
      - BACKEND_HOST=backend
      - FRONTEND_HOST=frontend
    volumes:
      - ./ssl/certs:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - letsencrypt_data:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    networks:
      - ai-factory-network
      - portainer-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: certbot-ssl
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    networks:
      - ai-factory-network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Ollama AI Service - Leverage your powerful specs
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-ai
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ollama_models:/root/.ollama/models
    networks:
      - ai-factory-network
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '4.0'  # Significant processing power for AI
          memory: 16G  # Large memory allocation for models
        reservations:
          cpus: '2.0'
          memory: 8G

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aifactory
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - ai-factory-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifactory"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --save 900 1 
      --save 300 10 
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - ai-factory-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Watchtower - Automatic Updates
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower-auto-update
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=true
    networks:
      - ai-factory-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Backup Service
  backup:
    image: offen/docker-volume-backup:latest
    container_name: backup-service
    restart: unless-stopped
    environment:
      - BACKUP_CRON_EXPRESSION=0 2 * * *
      - BACKUP_FILENAME=aifactory-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      - BACKUP_RETENTION_DAYS=30
      - EXEC_FORWARD_OUTPUT=true
    volumes:
      - postgres_data:/backup/postgres_data:ro
      - redis_data:/backup/redis_data:ro
      - backend_data:/backup/backend_data:ro
      - ollama_data:/backup/ollama_data:ro
      - ./backups:/archive
    networks:
      - ai-factory-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Cockpit - System monitoring dashboard
  cockpit:
    image: cockpit/ws:latest
    container_name: cockpit-monitoring
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ai-factory-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  ai-factory-network:
    driver: bridge
  portainer-network:
    driver: bridge

volumes:
  backend_data:
  frontend_cache:
  ollama_data:
  ollama_models:
  postgres_data:
  redis_data:
  letsencrypt_data:
  certbot_data:
  backup_data: