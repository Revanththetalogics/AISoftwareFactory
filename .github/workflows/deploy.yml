name: Build, Push & Deploy

# ─────────────────────────────────────────────────────────────
# Triggers on every push to staging or main.
# Both branches deploy to the same VPS (ai-staging.thetalogics.com).
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: revanth2245/aisoftwarefactory-backend
  FRONTEND_IMAGE: revanth2245/aisoftwarefactory-frontend
  # The tag = branch name (e.g. "staging" or "main")
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & push backend image
  # ──────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 2. Build & push frontend image
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://ai-staging.thetalogics.com/api
            NEXT_PUBLIC_WS_URL=wss://ai-staging.thetalogics.com/ws
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. Deploy to VPS — runs only after both images are pushed
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Copy nginx.conf to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "nginx.conf,docker-compose.yml"
          target: "/home/ubuntu/ai-factory"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /home/ubuntu/ai-factory

            echo "=== Pulling latest images ==="
            docker pull ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

            echo "=== Updating nginx config ==="
            cp nginx.conf /home/ubuntu/nginx.conf

            echo "=== Restarting services ==="
            BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            docker compose up -d --no-build

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo ""
            echo "✅ Deployment complete!"
            echo "   Branch : ${{ github.ref_name }}"
            echo "   Commit : ${{ github.sha }}"
            echo "   URL    : https://ai-staging.thetalogics.com"
