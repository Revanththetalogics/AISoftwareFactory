name: Build, Push & Deploy

# ─────────────────────────────────────────────────────────────
# Triggers on every push to staging or main.
# Both branches deploy to the same VPS (ai-staging.thetalogics.com).
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: revanth2245/aisoftwarefactory-backend
  FRONTEND_IMAGE: revanth2245/aisoftwarefactory-frontend
  # The tag = branch name (e.g. "staging" or "main")
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & push backend image
  # ──────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 2. Build & push frontend image
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://ai-staging.thetalogics.com/api
            NEXT_PUBLIC_WS_URL=wss://ai-staging.thetalogics.com/ws
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. Deploy to VPS — runs only after both images are pushed
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ── Write the SSH private key to a temp file ──────────────
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Write key using env var to preserve exact newlines
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # Validate the key is well-formed
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      # ── Copy config files, then deploy ────────────────────────
      - name: Copy config files & deploy
        run: |
          DEPLOY_BACKEND="${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}"
          DEPLOY_FRONTEND="${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}"

          # Copy config files to VPS
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            nginx.conf docker-compose.yml \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/home/ubuntu/ai-factory/

          # Run deployment remotely, passing image tags as env vars
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            "BACKEND_IMAGE=${DEPLOY_BACKEND} FRONTEND_IMAGE=${DEPLOY_FRONTEND} bash -s" << 'ENDSSH'
              set -e
              cd /home/ubuntu/ai-factory

              echo "=== Updating nginx config ==="
              cp nginx.conf /home/ubuntu/nginx.conf

              echo "=== Pulling latest images ==="
              docker pull "${BACKEND_IMAGE}"
              docker pull "${FRONTEND_IMAGE}"

              echo "=== Restarting services ==="
              docker compose up -d --no-build

              echo "=== Cleaning up old images ==="
              docker image prune -f

              echo ""
              echo "✅ Deployment complete!"
          ENDSSH
