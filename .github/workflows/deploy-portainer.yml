name: Deploy to Portainer

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - main
  push:
    branches: [staging, main]
    paths:
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-portainer.yml'

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Stack to Portainer
        run: |
          # Authenticate and get JWT token using admin credentials
          echo "Authenticating with Portainer..."
          AUTH_RESPONSE=$(curl -s -k -X POST "${{ secrets.PORTAINER_URL }}/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"${{ secrets.PORTAINER_PASSWORD }}\"}")
          
          JWT=$(echo $AUTH_RESPONSE | jq -r '.jwt')
          
          if [ "$JWT" = "null" ] || [ -z "$JWT" ]; then
            echo "Failed to authenticate with Portainer"
            echo "Response: $AUTH_RESPONSE"
            exit 1
          fi
          
          echo "Authenticated successfully"
          
          # Get endpoint ID (local Docker endpoint)
          echo "Getting endpoint ID..."
          ENDPOINT_ID=$(curl -s -k -X GET "${{ secrets.PORTAINER_URL }}/api/endpoints" \
            -H "Authorization: Bearer $JWT" | jq -r '.[0].Id')
          
          echo "Endpoint ID: $ENDPOINT_ID"
          
          # Check if stack already exists
          echo "Checking for existing stack..."
          STACKS=$(curl -s -k -X GET "${{ secrets.PORTAINER_URL }}/api/stacks" \
            -H "Authorization: Bearer $JWT")
          STACK_ID=$(echo $STACKS | jq -r ".[] | select(.Name==\"${{ secrets.PORTAINER_STACK_NAME }}\") | .Id")
          
          # Read and encode docker-compose file
          echo "Reading docker-compose file..."
          COMPOSE_CONTENT=$(cat docker-compose.prod.yml)
          
          # Build environment variables JSON array
          ENV_VARS=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg pg_pass "${{ secrets.POSTGRES_PASSWORD }}" \
            --arg secret "${{ secrets.SECRET_KEY }}" \
            '[
              {"name": "GITHUB_REPOSITORY", "value": $repo},
              {"name": "ENVIRONMENT", "value": "production"},
              {"name": "LOG_LEVEL", "value": "info"},
              {"name": "POSTGRES_PASSWORD", "value": $pg_pass},
              {"name": "DATABASE_URL", "value": "postgresql://aifactory:\($pg_pass)@postgres:5432/aifactory"},
              {"name": "REDIS_URL", "value": "redis://redis:6379"},
              {"name": "OLLAMA_URL", "value": "http://ollama:11434"},
              {"name": "SECRET_KEY", "value": $secret},
              {"name": "NEXT_PUBLIC_API_URL", "value": "https://ai-staging.thetalogics.com/api"}
            ]')
          
          if [ -z "$STACK_ID" ] || [ "$STACK_ID" = "null" ]; then
            # Create new stack
            echo "Creating new stack: ${{ secrets.PORTAINER_STACK_NAME }}"
            curl -s -k -X POST "${{ secrets.PORTAINER_URL }}/api/stacks?method=string&endpointId=$ENDPOINT_ID" \
              -H "Authorization: Bearer $JWT" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg name "${{ secrets.PORTAINER_STACK_NAME }}" \
                --arg compose "$COMPOSE_CONTENT" \
                --argjson env "$ENV_VARS" \
                '{Name: $name, StackFileContent: $compose, Env: $env}')"
          else
            # Update existing stack
            echo "Updating existing stack ID: $STACK_ID"
            curl -s -k -X PUT "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
              -H "Authorization: Bearer $JWT" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg compose "$COMPOSE_CONTENT" \
                --argjson env "$ENV_VARS" \
                '{StackFileContent: $compose, Env: $env, Prune: true}')"
          fi
          
          echo "Deployment completed!"

      - name: Verify Deployment
        run: |
          echo "Waiting for services to start..."
          sleep 60
          echo "Checking health endpoint..."
          curl -f https://ai-staging.thetalogics.com/api/health || echo "Health check failed, but deployment may still be starting..."
